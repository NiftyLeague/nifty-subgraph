version: 1
profile: application
languages: typescript
features: all
package_manager: bun
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.28.4
performance_runner: ubuntu-latest
performance: true
runner: ubuntu-slim
unit_runner: ubuntu-slim
ci_runner: ubuntu-slim
test_runner: ubuntu-slim
security_runner: ubuntu-slim
codeql_runner: ubuntu-latest
pr_runner: ubuntu-slim
release_runner: ubuntu-slim
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: node
npm_publish: false
license: apache-2.0
git_workflow: direct
merge_strategy: squash
codeql: auto
dependency_review: auto
toolchain: auto
post_release: false
post_release_workflow:
post_release_mode: auto
sync_mode: overlay
custom_workflows: preserve
codeql_rust_shards: '["all"]'
codeql_rust_threads: 1
codeql_rust_max_parallel: 1
release_merge_strategy: squash
opencode_security_model:
performance_command:
performance_profile:
performance_budget_file: performance-package-budgets.json
draft_protection: true
required_capabilities:
coverage_enforcement: auto
coverage_metrics: lines
coverage_report:
