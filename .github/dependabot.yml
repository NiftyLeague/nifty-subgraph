version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # Code Foundry runtime pins are sync-managed (runtime_ref in
      # code-foundry.yml). Dependabot must never bump them; a stale
      # github-actions group PR branched before a sync can resurrect
      # legacy caller files when merged.
      - dependency-name: '0xPlayerOne/code-foundry*'
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # assemblyscript is pinned to 0.19.x because matchstick-as 0.6.0 and the
      # graph-cli asc toolchain break on >=0.20 (the asc binary was removed).
      # See commit 8547945. Allow 0.19.x patches only.
      - dependency-name: 'assemblyscript'
        versions: ['>=0.20.0']
      # typescript-eslint 8.x does not support TS 7.0 (lint hard-crashes).
      # Re-enable when typescript-eslint supports TS >=7.1.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      cargo-dependencies:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ['*']
